# =============================================================
#  Honours — one block per result. Order does not matter.
#  `result` must be one of the keys in site.yaml → honours.results.
#  Each `tags` value must be one of the options in site.yaml → honours.facets.
#  `roster` feeds the player leaderboard: write each name the SAME way every time.
#
#  PREVIEW CONTENT: every competition, result and name below is an EXAMPLE,
#  not a real Durham result (DECISIONS.md D28).
# =============================================================

