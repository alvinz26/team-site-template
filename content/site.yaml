# =============================================================
#  Site settings — the whole site reads from this file.
#  Field reference: docs/data-model.md   Guide (中文): docs/content-guide.md
#
#  PREVIEW CONTENT: Durham branding with obvious placeholders (DECISIONS.md D28).
#  Every name, number and result below is a placeholder, not real club data.
# =============================================================

# ---------- Basic info ----------
name: Durham University Ultimate Frisbee Club    # full name, shown on the home page and in the browser tab
shortName: Durham Ultimate                       # short name, shown in the navigation bar
tagline: Placeholder tagline — one short line about the club.
org: Durham University                           # optional — school / organisation you belong to
# founded: 2000                                  # optional — year founded (needed for "auto: seasons")
description: >-
  Placeholder description. Replace this with two or three sentences about the club:
  who you are, how often you train, and that beginners are welcome.

# ---------- Site-wide notice (optional) ----------
# A banner shown at the top of every page. Delete the line to remove it.
notice: Preview — this is not the official Durham Ultimate website. All names, results and news are placeholders.

# ---------- Brand ----------
logo: images/brand/logo.svg       # optional — leave out to show the short name as text instead
colors:
  primary: "#3d1240"              # main colour (nav bar, headings). Keep the quotes!
  accent: "#8a2f8a"               # highlight colour (buttons, links). Keep the quotes!

# ---------- Contact ----------
email: hello@example.com          # optional — shown on the Contact page
socials:                          # optional — icons in the footer and on the Contact page
  - platform: instagram           # one of: instagram, facebook, x, tiktok, youtube, whatsapp, website
    url: https://example.com/instagram
  - platform: facebook
    url: https://example.com/facebook
  - platform: tiktok
    url: https://example.com/tiktok

# ---------- Home page ----------
# hero:                           # optional — the big picture at the top of the home page
#   image: images/home/hero.jpg
#   alt: Describe the picture for screen readers

stats:                            # optional — the row of numbers under the top of the home page
  - label: Founded
    value: TBC
  - label: Members
    value: TBC
  - label: Teams
    value: TBC

# ---------- Optional modules ----------
modules:
  honours: true                   # false = hide the Honours page and the honours parts of the home page
  news: true                      # false = hide the News pages and the latest news on the home page

# ---------- People page ----------
people:
  groups:                         # the sections of the People page, in display order
    - key: committee
      label: Committee
    - key: captains
      label: Captains
    - key: coaches
      label: Coaches

# ---------- Honours page ----------
honours:
  facets:                         # filters on the Honours page
    - key: level
      label: Level
      options:
        - Nationals
        - Regionals
        - Tournament
    - key: surface
      label: Indoor / Outdoor
      options:
        - Indoor
        - Outdoor
        - Beach
    - key: division
      label: Division
      options:
        - Open
        - Women's
        - Mixed
  results:                        # what a result can be. rank 1 = best.
    - key: gold
      label: Gold
      emoji: "🥇"
      rank: 1
    - key: silver
      label: Silver
      emoji: "🥈"
      rank: 2
    - key: bronze
      label: Bronze
      emoji: "🥉"
      rank: 3
    - key: spirit
      label: Spirit Award
      emoji: "🕊️"
      rank: 4
  # aliases:                      # optional — other spellings of the same person, merged on the leaderboard
  #   Joshua Smith:
  #     - Josh Smith

# ---------- Interface text (optional) ----------
# Leave this out to use the English defaults. Only list what you want to change.
# labels:
#   nav:
#     news: Latest news
