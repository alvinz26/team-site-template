# =============================================================
#  Site settings — the whole site reads from this file.
#  Field reference: docs/data-model.md   Guide (中文): docs/content-guide.md
#
#  Durham University Ultimate Frisbee Club — real public information, used with the
#  club's permission (DECISIONS.md D41). Sources: the Team Durham Ultimate Frisbee page,
#  the club's Instagram and Linktree. Unconfirmed details are left out for now.
# =============================================================

# ---------- Basic info ----------
name: Durham University Ultimate Frisbee Club
shortName: DUF
tagline: Mixed-gender, mixed-ability — everyone welcome.
org: Durham University · Team Durham
# founded:                       # unknown for now — add the year when confirmed
description: >-
  Durham Ultimate Frisbee (DUF) is one of the highest-performing university teams in the
  country, qualifying for every National Championship in the 2024–25 season. Most of our
  players had never heard of ultimate before arriving — and everyone is welcome.

# ---------- Site-wide notice (optional) ----------
notice: This website is under development — some information may be incomplete.

# ---------- Brand ----------
logo: images/brand/logo.jpg       # the club crest
colors:
  primary: "#3d1240"              # deep purple from the club logo. Keep the quotes!
  accent: "#8a2f8a"               # brighter purple from the club logo. Keep the quotes!

# ---------- Contact ----------
# email:                          # no public email yet
socials:
  - platform: instagram
    url: https://www.instagram.com/durhamultimatefrisbee/
  - platform: facebook
    url: https://www.facebook.com/groups/durhamultimatefrisbee/

# ---------- Home page ----------
# hero:                           # optional — the big picture at the top of the home page
#   image: images/home/hero.jpg
#   alt: Describe the picture for screen readers

# stats:                          # optional — add numbers when confirmed, e.g.
#   - label: Founded
#     value: "2000"

# ---------- Optional modules ----------
modules:
  honours: true
  news: true

# ---------- People page ----------
people:
  groups:                         # the sections of the People page, in display order
    - key: committee
      label: Committee
    - key: captains
      label: Captains
    - key: coaches
      label: Coaches

# ---------- Honours page ----------
honours:
  facets:
    - key: level
      label: Level
      options:
        - Nationals
        - Regionals
        - League
        - Tournament
    - key: surface
      label: Indoor / Outdoor
      options:
        - Indoor
        - Outdoor
        - Beach
    - key: division
      label: Division
      options:
        - Men's
        - Women's
        - Mixed
  results:
    - key: gold
      label: Gold
      emoji: "🥇"
      rank: 1
    - key: silver
      label: Silver
      emoji: "🥈"
      rank: 2
    - key: bronze
      label: Bronze
      emoji: "🥉"
      rank: 3
    - key: spirit
      label: Spirit Award
      emoji: "🕊️"
      rank: 4
