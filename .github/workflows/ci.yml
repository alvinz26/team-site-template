# Runs on every pull request (and on main) so nothing broken can be merged.
# The job name "Type check and tests" is what branch protection requires to pass.
#
# Fast path (D58): a pull request that only changes content or documentation skips the
# full 65-test suite (≈3–4 min). It still type-checks, validates all content, builds the
# real site and checks it for dead links (≈1–1.5 min). Anything else — and every push to
# main — runs everything.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Type check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed to compare the pull request with its base branch
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Decide which tests to run
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          full=true
          if [ "$EVENT" = "pull_request" ]; then
            changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
            echo "Changed files:"; echo "$changed"
            # Content-only = every changed file is content, docs or a README.
            if [ -n "$changed" ] && ! echo "$changed" | grep -qvE '^(content/|docs/|README(\.zh-CN)?\.md$|\.github/README(\.zh-CN)?\.md$)'; then
              full=false
            fi
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "Full test suite: $full"

      - name: Type check (also validates all content)
        run: npm run check

      - name: Full test suite
        if: steps.scope.outputs.full == 'true'
        run: npm test

      - name: Content checks (real site builds, no dead links)
        if: steps.scope.outputs.full != 'true'
        run: node --test --test-concurrency=1 --test-name-pattern="^S[02] " tests/pages.test.mjs
